version: '3.9'

services:

  # ── Hauptanwendung ──────────────────────────────────────────
  # Kestrel lauscht nur auf 127.0.0.1 im Container. Von aussen geht es ausschliesslich ueber Nginx,
  # der denselben Netzwerk-Namensraum nutzt (network_mode unten) – so greift der VPN-Filter in der Nginx-Config.
  server:
    build:
      context: .
      dockerfile: src/Einsatzueberwachung.Server/Dockerfile
    image: einsatzueberwachung-server:latest
    container_name: einsatz-server
    restart: unless-stopped
    ports:
      # Ports von Nginx (laeuft im Netzwerk dieses Containers). Port 5000 wird bewusst NICHT veroeffentlicht.
      - "80:80"
      - "443:443"
    volumes:
      - einsatz-data:/opt/einsatzueberwachung/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://127.0.0.1:5000
      - EINSATZUEBERWACHUNG_DATA_DIR=/opt/einsatzueberwachung/data
      - EINSATZUEBERWACHUNG_REPORT_DIR=/opt/einsatzueberwachung/data/berichte
      - DOTNET_PRINT_TELEMETRY_MESSAGE=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx Reverse-Proxy ──────────────────────────────────────
  # Teilt sich das Netzwerk mit "server": proxy_pass http://127.0.0.1:5000 in der Nginx-Config funktioniert
  # damit unveraendert wie bei der Installation ohne Docker.
  nginx:
    image: nginx:alpine
    container_name: einsatz-nginx
    restart: unless-stopped
    network_mode: "service:server"
    volumes:
      - ./deploy/nginx/einsatzueberwachung.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/ssl:ro
    depends_on:
      - server

volumes:
  einsatz-data:
    driver: local
  nginx-certs:
    driver: local
