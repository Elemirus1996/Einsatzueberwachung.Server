<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14181f" />
    <title>Keine Verbindung – Einsatzüberwachung</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14181f;
            color: #f0e9d8;
            font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        main { max-width: 26rem; padding: 24px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { margin: 0 0 16px; color: #c9c2b0; }
        button {
            min-height: 52px;
            padding: 12px 24px;
            border: 0;
            border-radius: 8px;
            background: #a72920;
            color: #fff;
            font: inherit;
            font-weight: 700;
        }
        .status { font-size: 0.85rem; color: #98a0ad; margin-top: 12px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" />
        <h1>Keine Verbindung zur Einsatzüberwachung</h1>
        <p>Funkloch oder VPN aus? Die Daten liegen sicher auf dem Server – sobald die Verbindung zurück ist, geht es
            hier automatisch weiter.</p>
        <button type="button" onclick="location.reload()">Jetzt erneut versuchen</button>
        <div class="status" id="status" aria-live="polite">Neuer Versuch in 10 s …</div>
    </main>
    <script>
        // Alle 10 Sekunden pruefen, ob der Server wieder erreichbar ist, und dann neu laden
        var seconds = 10;
        var status = document.getElementById('status');
        setInterval(function () {
            seconds -= 1;
            if (seconds > 0) { status.textContent = 'Neuer Versuch in ' + seconds + ' s …'; return; }
            seconds = 10;
            status.textContent = 'Prüfe Verbindung …';
            fetch('/health', { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () { });
        }, 1000);
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
