# Oeffentlicher Server-Block fuer die Mobile-Team-Ansicht (DuckDNS/Dynu Hostname).
# Von aussen nur die fuer Teams notwendigen Routen, alles andere -> 404.
# Nginx-Config-Test:  nginx -t   |   Reload:  systemctl reload nginx
#
# WICHTIG (ab 1.9.3): Upstream ist der eigene oeffentliche Port 5002, NICHT 5000. Der Pfadfilter hier reicht bei
# Blazor Server nicht aus – ueber /_blazor kann ein Browser innerhalb der Verbindung jede Seite aufrufen, ohne
# dass Nginx den Pfad sieht. Die App erkennt Anfragen auf Port 5002 und rendert dort nur die Team-Seiten.
# Voraussetzung in der systemd-Unit (siehe DEPLOYMENT.md):
#   ASPNETCORE_URLS=http://127.0.0.1:5000;http://127.0.0.1:5002
#   EINSATZUEBERWACHUNG_PUBLIC_PORT=5002
#
# Ab 1.10: Geraete im VPN (DNS im VPN per deploy/scripts/setup-vpn.sh) erreichen ueber denselben Namen die volle
# Oberflaeche auf Port 5000 – mit gueltigem Zertifikat. Erkannt am Absender aus dem VPN-Netz.

# Rate-Limit Zone gegen Brute-Force auf den Master-Token. Muss im http{}-Block stehen,
# alternativ in einem conf.d-Snippet.
limit_req_zone $binary_remote_addr zone=team_join_zone:10m rate=20r/m;
# Hintergrund-GPS der App „Traccar Client“ (ab 1.10): alle 10 s eine Position, nach einem Funkloch viele auf einmal.
limit_req_zone $binary_remote_addr zone=traccar_zone:10m rate=120r/m;

# VPN-Netz (muss zu deploy/wireguard/wg0.conf.example und einsatzueberwachung.conf passen)
geo $einsatz_vpn {
    default         0;
    10.10.0.0/24    1;
}
map $einsatz_vpn $einsatz_upstream {
    1       127.0.0.1:5000;
    default 127.0.0.1:5002;
}
# WebSocket nur weiterreichen, wenn der Browser ihn anfordert
map $http_upgrade $einsatz_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name dein-einsatz.mywire.org;

    ssl_certificate     /etc/letsencrypt/live/dein-einsatz.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dein-einsatz.mywire.org/privkey.pem;

    # Sicherheit: minimale TLS-Version, HSTS, kein Indexing
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Default proxy-Header (DRY)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Token-Login (Brute-Force-Schutz)
    location /team/login {
        limit_req zone=team_join_zone burst=10 nodelay;
        proxy_pass http://$einsatz_upstream;
    }

    # Team-Mobile-Seite
    location = /team {
        proxy_pass http://$einsatz_upstream;
    }

    location /team/ {
        proxy_pass http://$einsatz_upstream;
    }

    # REST fuer Mobile-API
    location /api/team-mobile/ {
        limit_req zone=team_join_zone burst=10 nodelay;
        proxy_pass http://$einsatz_upstream;
    }

    # Positionen von Traccar Client (exakter Pfad hat Vorrang vor /api/team-mobile/)
    location = /api/team-mobile/traccar {
        limit_req zone=traccar_zone burst=300 nodelay;
        proxy_pass http://$einsatz_upstream;
    }

    # SignalR-Hub des Mobile-Endpoints
    # Achtung: Bloecke mit eigenen proxy_set_header erben die allgemeinen oben NICHT (nginx-Regel) –
    # Host und X-Forwarded-* deshalb hier wiederholen, sonst sieht die App „127.0.0.1“ als Adresse.
    location /hubs/team-mobile {
        proxy_pass http://$einsatz_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1h;
    }

    # Blazor-Circuit (wird fuer InteractiveServer benoetigt)
    location /_blazor {
        proxy_pass http://$einsatz_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1h;
    }

    # Statische Assets, die fuer das Rendering benoetigt werden
    location /_framework/ { proxy_pass http://$einsatz_upstream; }
    location /_content/   { proxy_pass http://$einsatz_upstream; }
    location /css/        { proxy_pass http://$einsatz_upstream; }
    location /js/         { proxy_pass http://$einsatz_upstream; }
    location /lib/        { proxy_pass http://$einsatz_upstream; }
    # Dateien direkt im Hauptordner (app.css, leaflet-interop.js, favicon …) – auch mit Fingerabdruck im Namen
    # (z. B. app.jlypqgwbzp.css). Gleiche Regel wie in der App (PublicAccess.IsPublicPath).
    location ~ ^/[^/]+\.(css|js|png|ico|svg|woff2?|map)$ { proxy_pass http://$einsatz_upstream; }

    # Alles andere: von aussen nicht oeffentlich -> 404; im VPN die volle Oberflaeche (Einsatzleitung mit Anmeldung)
    location / {
        if ($einsatz_vpn = 0) {
            return 404;
        }
        proxy_pass http://$einsatz_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $einsatz_connection_upgrade;
        proxy_read_timeout 5m;
        client_max_body_size 100m;
    }
}
