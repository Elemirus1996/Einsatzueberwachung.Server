name: .NET Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Tests-Projekt
        run: dotnet restore src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj

      - name: Build Tests-Projekt
        run: dotnet build src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj -c Release --no-restore

      - name: Run Tests
        run: dotnet test src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: VPN-Hilfsprogramm testen
        run: bash deploy/scripts/test-einsatz-wg-peer.sh

      - name: Zertifikat-Hilfsprogramm testen
        run: bash deploy/scripts/test-einsatz-zertifikat.sh

      - name: Dynu-Hook fuer das interne Zertifikat testen
        run: bash deploy/scripts/test-einsatz-dynu-dns.sh

      - name: Einstellungen der Staffel testen (einsatz-staffel)
        run: bash deploy/scripts/test-einsatz-staffel.sh

      - name: nginx-Vorlagen pruefen (nginx -t)
        run: |
          command -v nginx >/dev/null || (sudo apt-get update && sudo apt-get install -y nginx)
          T="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$T/key.pem" -out "$T/cert.pem" -subj "/CN=test" -days 1 2>/dev/null
          # Vorlagen auch mit anderer Domain und anderem VPN-Netz (einsatz-staffel) pruefen
          export EINSATZ_STAFFEL_CONF="$T/staffel.conf"
          bash deploy/scripts/einsatz-staffel setzen domain staffel-x.example.org
          bash deploy/scripts/einsatz-staffel setzen vpn_netz 172.20.5.0/24
          mkdir "$T/staffel"
          for f in deploy/nginx/*.conf; do
            bash deploy/scripts/einsatz-staffel vorlage "$f" > "$T/staffel/$(basename "$f")"
          done
          zert() {
            sed -e "s#/etc/letsencrypt/live/[^/]*/fullchain.pem#$T/cert.pem#; s#/etc/letsencrypt/live/[^/]*/privkey.pem#$T/key.pem#" \
                -e "s#/etc/ssl/certs/einsatz.crt#$T/cert.pem#; s#/etc/ssl/private/einsatz.key#$T/key.pem#" "$1"
          }
          for f in deploy/nginx/*.conf; do
            zert "$f" > "$T/$(basename "$f")"
            zert "$T/staffel/$(basename "$f")" > "$T/staffel-$(basename "$f")"
          done
          printf 'pid %s/nginx.pid;\nerror_log %s/error.log;\nevents {}\nhttp {\n  access_log off;\n  include %s/einsatzueberwachung*.conf;\n}\n' "$T" "$T" "$T" > "$T/nginx.conf"
          sudo nginx -t -c "$T/nginx.conf"
          printf 'pid %s/nginx2.pid;\nerror_log %s/error.log;\nevents {}\nhttp {\n  access_log off;\n  include %s/staffel-*.conf;\n}\n' "$T" "$T" "$T" > "$T/nginx2.conf"
          sudo nginx -t -c "$T/nginx2.conf"

      - name: Oeffentliche nginx-Vorlage testen (Weiterleitung, Kopfzeilen, VPN)
        run: bash deploy/scripts/test-nginx-public.sh

      - name: Upload Test-Ergebnisse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
