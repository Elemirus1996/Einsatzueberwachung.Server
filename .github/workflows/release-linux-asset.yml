name: Release Linux Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (z. B. v1.1.3)"
        required: true

permissions:
  contents: write

jobs:
  build-livetracking:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish LiveTracking (Windows x64)
        run: dotnet publish src/Einsatzueberwachung.LiveTracking -c Release -r win-x64 --self-contained true -o artifacts/livetracking

      - name: Create livetracking.zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/livetracking/* -DestinationPath artifacts/livetracking.zip

      - name: Upload livetracking artifact
        uses: actions/upload-artifact@v4
        with:
          name: livetracking-zip
          path: artifacts/livetracking.zip

  build-server:
    runs-on: ubuntu-latest
    needs: build-livetracking

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish server linux-x64
        run: dotnet publish src/Einsatzueberwachung.Server -c Release -r linux-x64 --self-contained false -o artifacts/release/linux-x64/server-${{ steps.version.outputs.version }}

      # Native Linux-Bibliotheken (SkiaSharp fuer PDF/Karten/Logo, HarfBuzz fuer Text in SVG-Logos) sicher im Paket.
      # Mit `--self-contained false` kommen sie nicht zuverlaessig mit. Immer genau die Version aus dem Projekt holen –
      # eine andere Version passt nicht zur verwalteten DLL. Versionen: Einsatzueberwachung.Server.csproj.
      - name: Ensure native libraries in publish output
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="artifacts/release/linux-x64/server-${{ steps.version.outputs.version }}"
          CSPROJ="src/Einsatzueberwachung.Server/Einsatzueberwachung.Server.csproj"
          version_von() { grep -oP "<PackageReference Include=\"$1\" Version=\"\K[^\"]+" "$CSPROJ"; }

          hole() { # $1 NuGet-Paket, $2 Datei, $3 Version
            if [ -f "$PUBLISH_DIR/$2" ]; then echo "$2 bereits vorhanden"; return; fi
            curl -sfLo "/tmp/$1.nupkg" "https://www.nuget.org/api/v2/package/$1/$3"
            rm -rf "/tmp/$1"; mkdir -p "/tmp/$1"
            unzip -oq "/tmp/$1.nupkg" -d "/tmp/$1"
            cp "/tmp/$1/runtimes/linux-x64/native/$2" "$PUBLISH_DIR/$2"
            echo "$2 $3 kopiert ($(stat -c%s "$PUBLISH_DIR/$2") bytes)"
          }

          hole SkiaSharp.NativeAssets.Linux libSkiaSharp.so "$(version_von SkiaSharp)"
          hole HarfBuzzSharp.NativeAssets.Linux libHarfBuzzSharp.so "$(version_von HarfBuzzSharp)"

      - name: Download livetracking artifact
        uses: actions/download-artifact@v4
        with:
          name: livetracking-zip
          path: artifacts/release/linux-x64/server-${{ steps.version.outputs.version }}

      - name: Create zip asset
        shell: bash
        run: |
          cd artifacts/release/linux-x64/server-${{ steps.version.outputs.version }}
          zip -r ../linux-x64-server-${{ steps.version.outputs.version }}.zip .

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: artifacts/release/linux-x64/linux-x64-server-${{ steps.version.outputs.version }}.zip
          overwrite_files: true
