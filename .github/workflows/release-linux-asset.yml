name: Release Linux Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (z. B. v1.1.3)"
        required: true

permissions:
  contents: write

jobs:
  build-livetracking:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish LiveTracking (Windows x64)
        run: dotnet publish src/Einsatzueberwachung.LiveTracking -c Release -r win-x64 --self-contained true -o artifacts/livetracking

      - name: Create livetracking.zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/livetracking/* -DestinationPath artifacts/livetracking.zip

      - name: Upload livetracking artifact
        uses: actions/upload-artifact@v4
        with:
          name: livetracking-zip
          path: artifacts/livetracking.zip

  build-server:
    runs-on: ubuntu-latest
    needs: build-livetracking

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Zwei Pakete: linux-x64 (PC, Mietserver) und linux-arm64 (Raspberry Pi 4/5 mit 64-Bit-System).
      # Der Update-Dienst im Server waehlt das Paket zum eigenen Prozessor (GitHubUpdateService.IsLinuxAssetFor).
      - name: Publish server linux-x64 und linux-arm64
        shell: bash
        run: |
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/Einsatzueberwachung.Server -c Release -r "$rid" --self-contained false \
              -o "artifacts/release/$rid/server-${{ steps.version.outputs.version }}"
          done

      # Native Linux-Bibliotheken (SkiaSharp fuer PDF/Karten/Logo, HarfBuzz fuer Text in SVG-Logos) sicher im Paket.
      # Mit `--self-contained false` kommen sie nicht zuverlaessig mit. Immer genau die Version aus dem Projekt holen –
      # eine andere Version passt nicht zur verwalteten DLL. Versionen: Einsatzueberwachung.Server.csproj.
      - name: Ensure native libraries in publish output
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ="src/Einsatzueberwachung.Server/Einsatzueberwachung.Server.csproj"
          version_von() { grep -oP "<PackageReference Include=\"$1\" Version=\"\K[^\"]+" "$CSPROJ"; }

          hole() { # $1 Laufzeit (linux-x64/linux-arm64), $2 NuGet-Paket, $3 Datei, $4 Version
            local dir="artifacts/release/$1/server-${{ steps.version.outputs.version }}"
            if [ -f "$dir/$3" ]; then echo "$1: $3 bereits vorhanden"; return; fi
            if [ ! -d "/tmp/$2" ]; then
              curl -sfLo "/tmp/$2.nupkg" "https://www.nuget.org/api/v2/package/$2/$4"
              mkdir -p "/tmp/$2"
              unzip -oq "/tmp/$2.nupkg" -d "/tmp/$2"
            fi
            cp "/tmp/$2/runtimes/$1/native/$3" "$dir/$3"
            echo "$1: $3 $4 kopiert ($(stat -c%s "$dir/$3") bytes)"
          }

          for rid in linux-x64 linux-arm64; do
            hole "$rid" SkiaSharp.NativeAssets.Linux libSkiaSharp.so "$(version_von SkiaSharp)"
            hole "$rid" HarfBuzzSharp.NativeAssets.Linux libHarfBuzzSharp.so "$(version_von HarfBuzzSharp)"
          done

      - name: Download livetracking artifact
        uses: actions/download-artifact@v4
        with:
          name: livetracking-zip
          path: artifacts/release/linux-x64/server-${{ steps.version.outputs.version }}

      - name: Create zip assets
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          cp "artifacts/release/linux-x64/server-$V/livetracking.zip" "artifacts/release/linux-arm64/server-$V/"
          for rid in linux-x64 linux-arm64; do
            (cd "artifacts/release/$rid/server-$V" && zip -r "../$rid-server-$V.zip" .)
          done

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/release/linux-x64/linux-x64-server-${{ steps.version.outputs.version }}.zip
            artifacts/release/linux-arm64/linux-arm64-server-${{ steps.version.outputs.version }}.zip
          overwrite_files: true
