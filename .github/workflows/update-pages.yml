name: Update GitHub Pages on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Release wuerde sonst der Tag (detached HEAD) ausgecheckt – der Push auf main schlug fehl
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/generate_changelog.py docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen – kein Commit nötig."
            exit 0
          fi
          git commit -m "docs: changelog aktualisiert für ${{ github.event.release.tag_name || 'manuell' }}"
          git pull --rebase origin main
          git push origin HEAD:main
